name: Deploy examples to GitHub Pages

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build examples site
        env:
          # Project Pages: https://<user>.github.io/contract-kit/
          EXAMPLES_BASE: /contract-kit/
          # public/templates already in git; regenerating needs package dist/
          SKIP_TEMPLATES: '1'
        run: node scripts/build-examples-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-examples

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
